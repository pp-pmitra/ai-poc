  }

  html,body{background:var(--bg);color:var(--text);margin:0;padding:0;height:100%;overflow:hidden;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}

  #app{display:flex;flex-direction:column;height:100%;}
  #header{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg);flex-shrink:0;}
  #header h1{font-size:15px;font-weight:700;margin:0;}
  #header .meta{font-size:12px;color:var(--text-2);display:flex;gap:16px;align-items:center;}
  #legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-2);}
  .leg-dot{width:10px;height:10px;border-radius:3px;border:1.5px solid;}

  #toolbar{padding:8px 20px;border-bottom:1px solid var(--border);background:var(--bg-2);display:flex;gap:12px;align-items:center;flex-shrink:0;}
  #search{width:240px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;outline:none;}
  #search:focus{border-color:var(--accent);}
  #search::placeholder{color:var(--text-3);}
  .tool-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text-2);font-size:11px;cursor:pointer;}
  .tool-btn:hover{background:var(--bg-3);}

  #tree-wrap{flex:1;overflow:auto;padding:40px 32px 120px 32px;}

  /* === CARD: fixed 32px height === */
  .card{
    height:32px;padding:0 12px;border-radius:6px;border:2px solid;cursor:pointer;user-select:none;
    white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
    transition:transform 0.12s,box-shadow 0.12s;flex-shrink:0;
  }
  .card:hover{transform:scale(1.05);box-shadow:0 3px 12px rgba(0,0,0,0.1);}
  .card.gap{border-style:dashed;}
  .card.ref{opacity:0.4;cursor:default;border-style:dotted;}
  .card.ref:hover{transform:none;box-shadow:none;}
  .card.hl{outline:3px solid var(--accent);outline-offset:3px;}
  .card .nm{font-size:12px;font-weight:700;}
  .card .tog{width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--bg-3);color:var(--text-2);flex-shrink:0;line-height:1;}
  .card .bdg{font-size:8px;padding:1px 5px;border-radius:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
  .card .cnt{font-size:9px;color:var(--text-3);}

  /* === TREE STRUCTURE ===
     .node = horizontal flex: [card] [arm] [children-col]
     .child-row = flex row: [rail-col] [child .node]
     rail-col has: vertical line (full stretch) + horizontal line (fixed 16px from top = card center)
  */
  .node{display:flex;flex-direction:row;align-items:flex-start;}

  .children-col{display:flex;flex-direction:column;}
  .children-col.collapsed{display:none;}

  /* Arm: horizontal line from parent card center to the children rail */
  .arm{width:28px;height:32px;position:relative;flex-shrink:0;}
  .arm::after{content:'';position:absolute;left:0;top:16px;width:28px;height:1.5px;background:var(--line);border-radius:1px;}

  /* Each child row. First row sits flush with the top so its card center (16px)
     lines up exactly with the parent's arm; other rows keep the 3px breathing room. */
  .child-row{display:flex;flex-direction:row;align-items:flex-start;padding:3px 0;}
  .child-row:first-child{padding-top:0;}

  /* Rail column: vertical trunk + horizontal tick connecting to each card */
  .rail{width:24px;align-self:stretch;position:relative;flex-shrink:0;}
  /* Middle rows: straight trunk running the full row height, with a tick at the card center (19px = 3px padding + 16px) */
  .rail::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1.5px;background:var(--line);border-radius:1px;}
  .rail::after{content:'';position:absolute;left:0;top:19px;width:24px;height:1.5px;background:var(--line);border-radius:1px;}

  /* First child: rounded elbow — trunk enters at the card center (16px, no top padding) and curves right into the tick */
  .child-row:first-child>.rail::before{
    top:16px;bottom:0;width:24px;height:auto;background:none;
    border-left:1.5px solid var(--line);border-top:1.5px solid var(--line);
    border-top-left-radius:8px;
  }
  .child-row:first-child>.rail::after{display:none;}

  /* Last child: rounded elbow — trunk arrives from above and curves right into the tick (19px = 3px padding + 16px) */
  .child-row:last-child>.rail::before{
    top:0;bottom:auto;height:21px;width:24px;background:none;
    border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
    border-bottom-left-radius:8px;
  }
  .child-row:last-child>.rail::after{display:none;}

  /* Only child: no trunk at all, just the tick to the card */
  .child-row:only-child>.rail::before{display:none;border:none;background:none;}
  .child-row:only-child>.rail::after{display:block;top:16px;}
</style>

let nc=0,ec=0,gc=0;

const treeWrap=document.getElementById('tree-wrap');
const placed=new Set();
const allToggles=[];

function sn(n){return n.replace(/Page$/,'').replace(/Panel$/,'').replace(/Tab$/,'').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/([A-Z]+)([A-Z][a-z])/g,'$1 $2');}

function build(name,ancestors){
  const d=GRAPH[name];if(!d)return null;
  const isRef=placed.has(name);
  const m=MC[d.module]||MC.auth;
  const edges=(d.edges||[]).filter(e=>GRAPH[e.target]&&!ancestors.has(e.target));
  const hasKids=!isRef&&edges.length>0;

  placed.add(name);

  const node=document.createElement('div');node.className='node';node.dataset.name=name;

  const card=document.createElement('div');
  card.className='card'+(d.framework_gap?' gap':'')+(isRef?' ref':'');
  card.style.borderColor=`var(${m.c})`;card.style.background=`var(${m.bg})`;

  if(hasKids){const t=document.createElement('span');t.className='tog';t.textContent='+';card.appendChild(t);}

  const nm=document.createElement('span');nm.className='nm';nm.style.color=`var(${m.c})`;nm.textContent=sn(name);
  card.appendChild(nm);

  if(d.framework_gap){const b=document.createElement('span');b.className='bdg';b.style.background='var(--admin-bg)';b.style.color='var(--admin)';b.textContent='GAP';card.appendChild(b);}
  if(d.landing){const b=document.createElement('span');b.className='bdg';b.style.background=`var(${m.bg})`;b.style.color=`var(${m.c})`;b.style.border=`1px solid var(${m.c})`;b.textContent='LANDING';card.appendChild(b);}
  if(hasKids){const c=document.createElement('span');c.className='cnt';c.textContent=edges.length;card.appendChild(c);}
  if(isRef){const r=document.createElement('span');r.style.cssText='font-size:9px;color:var(--text-3)';r.textContent='↗';card.appendChild(r);}

  node.appendChild(card);

  if(hasKids){
    const arm=document.createElement('div');arm.className='arm';
    node.appendChild(arm);

    const col=document.createElement('div');col.className='children-col collapsed';
    const newAnc=new Set(ancestors);newAnc.add(name);

    for(const e of edges){
      const row=document.createElement('div');row.className='child-row';
      const rail=document.createElement('div');rail.className='rail';
      rail.title=e.action;
      row.appendChild(rail);
      const child=build(e.target,newAnc);
      if(child)row.appendChild(child);
      col.appendChild(row);
    }
    node.appendChild(col);

    let open=false;
    const toggle=()=>{
      if(isRef)return;
      open=!open;
      col.classList.toggle('collapsed',!open);
      const t=card.querySelector('.tog');if(t)t.textContent=open?'−':'+';
    };
    card.addEventListener('click',toggle);
    allToggles.push({expand:()=>{if(!open)toggle();},collapse:()=>{if(open)toggle();}});
  }
  return node;
}

treeWrap.appendChild(build('LoginPage',new Set()));

document.getElementById('expand-all').addEventListener('click',()=>allToggles.forEach(t=>t.expand()));
document.getElementById('collapse-all').addEventListener('click',()=>{for(let i=allToggles.length-1;i>=0;i--)allToggles[i].collapse();});

document.getElementById('search').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  treeWrap.querySelectorAll('.card').forEach(c=>c.classList.remove('hl'));
  if(!q)return;
  treeWrap.querySelectorAll('.card').forEach(c=>{
    const n=c.closest('.node')?.dataset.name||'';
    if(n.toLowerCase().includes(q)||sn(n).toLowerCase().includes(q)){
      c.classList.add('hl');
      let w=c.closest('.children-col');
      while(w){
        if(w.classList.contains('collapsed')){
          w.classList.remove('collapsed');
          const pt=w.closest('.node')?.querySelector(':scope>.card .tog');
          if(pt)pt.textContent='−';
        }
        w=w.parentElement?.closest('.children-col');
      }
    }
  });
});
</script>
