<!--
  PulsePoint Platform — Navigation Map (Single Source of Truth)
  =============================================================
  This file serves TWO purposes:
  1. VISUAL: Open in a browser to see the interactive node diagram
  2. DATA:  Skills (iDesign, iAutomate, scenario-dev) read the JSON
           block below (id="nav-graph") for path-finding

  HOW SKILLS USE THIS FILE:
    Read this file → extract JSON between <script id="nav-graph"> tags
    → parse it → trace paths between nodes → look up implementations
    from src/main/java/pages/ and src/test/java/stepdefinitions/

  STRUCTURE:
    Each key is a node (page/state). Fields:
      module         = which platform module (life, studio, hcp, admin, etc.)
      has_mega_menu  = true if hamburger menu is accessible from this page
      framework_gap  = true if no page object / step definition exists yet
      landing        = true if this is the module's default entry page
      note           = optional context about the page
      edges[]        = navigation actions FROM this node
        action       = human-readable description of the action
        target       = destination node name

  PATH-FINDING:
    1. Check if A has a direct edge to B → use it (one hop)
    2. If not, and A has_mega_menu → go A → MegaMenu → B (two hops)
    3. If B is nested → follow intermediate nodes: A → MegaMenu → Parent → B
-->

<script>
// Load graph data from the embedded JSON block
const NAV_DATA = JSON.parse(document.getElementById('nav-graph').textContent);

// Convert to compact rendering format (m=module, mega=has_mega_menu, gap=framework_gap, edges with t=target, a=action)
const GRAPH = {};
for (const [name, node] of Object.entries(NAV_DATA)) {
  GRAPH[name] = {
    m: node.module,
    mega: node.has_mega_menu ? 1 : 0,
    gap: node.framework_gap ? 1 : 0,
    edges: (node.edges || []).map(e => ({ t: e.target, a: e.action }))
  };
}

const MC={
  life:{c:'--life',bg:'--life-bg',sec:'--life-sec',label:'Life / Campaigns'},
  studio:{c:'--studio',bg:'--studio-bg',sec:'--studio-sec',label:'Studio'},
  hcp:{c:'--hcp',bg:'--hcp-bg',sec:'--hcp-sec',label:'HCP / Signal'},
  hcp365:{c:'--hcp365',bg:'--hcp365-bg',sec:'--hcp365-sec',label:'HCP365'},
  admin:{c:'--admin',bg:'--admin-bg',sec:'--admin-sec',label:'Administration'},
  shared:{c:'--shared',bg:'--shared-bg',sec:'--shared-sec',label:'Shared / Menu'},
  auth:{c:'--auth',bg:'--auth-bg',sec:'--auth-sec',label:'Auth'},
  utility:{c:'--utility',bg:'--utility-bg',sec:'--utility-sec',label:'Utility'},
  audience_manager:{c:'--am',bg:'--am-bg',sec:'--am-sec',label:'Audience Mgr'},
  fabric:{c:'--fabric',bg:'--fabric-bg',sec:'--fabric-sec',label:'Fabric'},
};

const legend=document.getElementById('legend');
for(const[k,v]of Object.entries(MC)){
  const d=document.createElement('div');d.className='leg-item';
  d.innerHTML=`<div class="leg-dot" style="background:var(${v.bg});border-color:var(${v.c});"></div>${v.label}`;
  legend.appendChild(d);
}

// ===== LAYOUT =====
const NW=130,NH=30,GX=14,GY=12;
const nodes={};

function row(names,x0,y0){names.forEach((n,i)=>{nodes[n]={x:x0+i*(NW+GX),y:y0,w:NW,h:NH};});}

// === TOP: Auth + MegaMenu ===
const TOP=30;
nodes['LoginPage']={x:40,y:TOP,w:NW,h:NH};
nodes['AdminLanding']={x:40+NW+GX,y:TOP,w:NW,h:NH};
nodes['MegaMenu']={x:420,y:TOP,w:170,h:40};
nodes['CampaignReportingSubmenu']={x:640,y:TOP-2,w:155,h:NH};
nodes['HCP365ReportsSubmenu']={x:640,y:TOP+NH+GY-2,w:155,h:NH};

// === LEFT COLUMN: Life Module ===
const LIFE_Y=TOP+70;
const LX=40;

row(['CampaignDashboard','CampaignDetailsPage','LineItemDetailsPage','TacticDetailsPage','TacticSettingsPage'],LX,LIFE_Y);

const NPI_Y=LIFE_Y+NH+GY+20;
row(['NPIListsPage','NPIStaticListPage','NPISmartListPage','NPIAutoImportedListPage'],LX,NPI_Y);
row(['NPIMedscapeListPage','NPIListDetailPage','NPIAttributesListPage'],LX,NPI_Y+NH+GY);

const OTH_Y=NPI_Y+(NH+GY)*2+20;
row(['PixelsPage','PixelCreatePanel','TargetingTemplatesPage','CreativeLibraryPage','CuratedMarketsPage'],LX,OTH_Y);
row(['DomainAndAppListsPage','KeywordListsPage','IPAddressListsPage','EmailListsPage','PMPDealsPage'],LX,OTH_Y+NH+GY);

const RPT_Y=OTH_Y+(NH+GY)*2+20;
row(['RunReportPage','ReportTemplatesPage','ScheduledReportsPage','GeneratedReportsPage'],LX,RPT_Y);

const GAP_Y=RPT_Y+NH+GY+20;
row(['DealsPage','DealGroupsPage','TagManagerPage','PersonalizationAPIPage','IBIQDashboardsPage'],LX,GAP_Y);
row(['MedscapeOnePage','MedscapeOneMedAffairsPage','MedscapeCampaignPerformancePage','HCP365AnalyticsPage','CollectionsPage'],LX,GAP_Y+NH+GY);
row(['HCP365DataMappingPage','DestinationsPage','AnalyticsChatbotPage','MediaPlannerPage','CampaignSettingsPage'],LX,GAP_Y+(NH+GY)*2);
row(['HCP365ReportsRunPage','MedscapeAffinityPage'],LX,GAP_Y+(NH+GY)*3);

const UTL_Y=GAP_Y+(NH+GY)*3+20;
row(['KnowledgeBasePage','CustomerSupportPage','AudienceMarketplacePage'],LX,UTL_Y);

// === RIGHT COLUMN ===
const RX=850;

const STU_Y=LIFE_Y;
row(['StudioDashboard','WorkspaceTypeSelection','WorkspaceView'],RX,STU_Y);
row(['HCPExplorerWorkspace','ExpansionWorkspace','BrandExplorerWorkspace','DTCExplorerWorkspace'],RX,STU_Y+NH+GY);

const HCP_Y=STU_Y+(NH+GY)*2+30;
row(['HCPLanding','SmartActionsPage','SmartActionCreatePage'],RX,HCP_Y);

const MOD_Y=HCP_Y+NH+GY+30;
row(['HCP365Dashboard','AudienceManagerPage','FabricPage'],RX,MOD_Y);

// Administration — all 7 tabs
const ADM_Y=MOD_Y+NH+GY+30;
row(['AdministrationPage'],RX,ADM_Y);

const SEG_Y=ADM_Y+NH+GY+10;
row(['AdminSegmentsPage','AdminAMAudiencesPage','AdminNewSegmentPage','AdminBulkSegmentCreationPage'],RX,SEG_Y);
row(['AdminManageDataProvidersPage'],RX,SEG_Y+NH+GY);

const ACC_Y=SEG_Y+(NH+GY)*2+10;
row(['AccountsPage','AdminNewAccountPage','AdminNewAccountGroupPage','AdminAccountLifeFeesPage'],RX,ACC_Y);
row(['AdminAccountSmartlistFeesPage','AdminAccountKomodoFeesPage','AccountDetailPage'],RX,ACC_Y+NH+GY);
row(['AccountDetailsTab','AccountAdvertiserPage','AccountAdvertiserGlobalSignals','AccountReportingPage'],RX,ACC_Y+(NH+GY)*2);
row(['AddDestinationPanel','AccountUserPage','AccountLifeSettingsPanel','AccountStudioSettingsPanel'],RX,ACC_Y+(NH+GY)*3);

const USR_Y=ACC_Y+(NH+GY)*4+10;
row(['AdminUsersPage','AdminExternalUsersPage','AdminInternalUsersPage','AdminNewUserPage'],RX,USR_Y);

const ADV_Y=USR_Y+NH+GY+10;
row(['AdvertiserListPage','AdminNewAdvertiserPage'],RX,ADV_Y);

const STP_Y=ADV_Y+NH+GY+10;
row(['SetupPage','SetupAlertsPage','SetupLoadersPage','SetupCuratedMarketsPage'],RX,STP_Y);
row(['SetupLifeMarketplaceDealsPage','SetupEndemicsPage','SetupGlobalFeesPage','SetupAdaptiveOptimizationPage'],RX,STP_Y+NH+GY);
row(['SetupGlobalSettingsPage'],RX,STP_Y+(NH+GY)*2);

const LST_Y=STP_Y+(NH+GY)*3+10;
row(['AdminListsPage','AdminKeywordListsPage','AdminDomainAppListsPage','AdminNPIListsPage'],RX,LST_Y);

const DSH_Y=LST_Y+NH+GY+10;
row(['AdminDashboardsPage','AdminLifeLookerViewsPage','AdminHCP365LookerViewsPage','AdminIBIQDashboardsPage'],RX,DSH_Y);
row(['AdminMedscapeDashboardsPage'],RX,DSH_Y+NH+GY);

// Stats
let nc=0,ec=0,gc=0;
for(const[k,v]of Object.entries(GRAPH)){nc++;ec+=v.edges.length;if(v.gap)gc++;}
document.getElementById('stats').textContent=`${nc} nodes · ${ec} edges · ${gc} framework gaps`;

// ===== SECTIONS =====
const SECTIONS=[
  {label:'AUTH',x:30,y:TOP-10,w:280,h:50,mod:'auth'},
  {label:'MEGA MENU',x:410,y:TOP-12,w:190,h:58,mod:'shared'},
  {label:'REPORTING SUBMENUS',x:630,y:TOP-12,w:175,h:NH*2+GY+20,mod:'shared'},
  {label:'LIFE — Campaign Drill-Down',x:LX-10,y:LIFE_Y-18,w:(NW+GX)*5+6,h:NH+26,mod:'life'},
  {label:'LIFE — NPI Lists',x:LX-10,y:NPI_Y-18,w:(NW+GX)*4+6,h:(NH+GY)*2+16,mod:'life'},
  {label:'LIFE — Pages',x:LX-10,y:OTH_Y-18,w:(NW+GX)*5+6,h:(NH+GY)*2+16,mod:'life'},
  {label:'LIFE — Reporting',x:LX-10,y:RPT_Y-18,w:(NW+GX)*4+6,h:NH+26,mod:'life'},
  {label:'LIFE — Framework Gaps',x:LX-10,y:GAP_Y-18,w:(NW+GX)*5+6,h:(NH+GY)*4+16,mod:'life'},
  {label:'UTILITY',x:LX-10,y:UTL_Y-18,w:(NW+GX)*3+6,h:NH+26,mod:'utility'},
  {label:'STUDIO',x:RX-10,y:STU_Y-18,w:(NW+GX)*4+6,h:(NH+GY)*2+16,mod:'studio'},
  {label:'HCP / SIGNAL',x:RX-10,y:HCP_Y-18,w:(NW+GX)*3+6,h:NH+26,mod:'hcp'},
  {label:'MODULE LANDINGS',x:RX-10,y:MOD_Y-18,w:(NW+GX)*3+6,h:NH+26,mod:'hcp365'},
  {label:'ADMIN — Hub',x:RX-10,y:ADM_Y-18,w:(NW+GX)*1+6,h:NH+26,mod:'admin'},
  {label:'ADMIN — Segments',x:RX-10,y:SEG_Y-18,w:(NW+GX)*4+6,h:(NH+GY)*2+16,mod:'admin'},
  {label:'ADMIN — Accounts',x:RX-10,y:ACC_Y-18,w:(NW+GX)*4+6,h:(NH+GY)*4+16,mod:'admin'},
  {label:'ADMIN — Users',x:RX-10,y:USR_Y-18,w:(NW+GX)*4+6,h:NH+26,mod:'admin'},
  {label:'ADMIN — Advertisers',x:RX-10,y:ADV_Y-18,w:(NW+GX)*2+6,h:NH+26,mod:'admin'},
  {label:'ADMIN — Setup',x:RX-10,y:STP_Y-18,w:(NW+GX)*4+6,h:(NH+GY)*3+16,mod:'admin'},
  {label:'ADMIN — Lists',x:RX-10,y:LST_Y-18,w:(NW+GX)*4+6,h:NH+26,mod:'admin'},
  {label:'ADMIN — Dashboards',x:RX-10,y:DSH_Y-18,w:(NW+GX)*4+6,h:(NH+GY)*2+16,mod:'admin'},
];

// ===== CANVAS =====
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const wrap=document.getElementById('canvas-wrap');
const infobar=document.getElementById('infobar');

let scale=1,panX=0,panY=0,dpr=window.devicePixelRatio||1;
let hoveredNode=null,searchTerm='';

function resize(){
  const r=wrap.getBoundingClientRect();
  canvas.width=r.width*dpr;canvas.height=r.height*dpr;
  canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
  draw();
}
window.addEventListener('resize',resize);

function gs(p){return getComputedStyle(document.documentElement).getPropertyValue(p).trim();}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();ctx.translate(panX,panY);ctx.scale(scale,scale);

  for(const s of SECTIONS){
    const mc=MC[s.mod];
    ctx.fillStyle=gs(mc.bg);ctx.strokeStyle=gs(mc.c);
    ctx.lineWidth=1;ctx.globalAlpha=0.4;ctx.setLineDash([]);
    ctx.beginPath();ctx.roundRect(s.x,s.y,s.w,s.h,8);ctx.fill();
    ctx.globalAlpha=0.2;ctx.stroke();
    ctx.globalAlpha=0.5;ctx.fillStyle=gs(mc.c);
    ctx.font='600 9px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif';
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText(s.label,s.x+8,s.y+4);
    ctx.globalAlpha=1;
  }

  for(const[name,data]of Object.entries(GRAPH)){
    const src=nodes[name];if(!src)continue;
    for(const e of data.edges){
      const tgt=nodes[e.t];if(!tgt)continue;
      const hl=hoveredNode&&(hoveredNode===name||hoveredNode===e.t);
      const dim=hoveredNode&&!hl;
      ctx.globalAlpha=dim?0.04:(hl?0.9:0.15);
      ctx.strokeStyle=hl?gs('--accent'):gs('--border');
      ctx.lineWidth=hl?1.6:0.7;ctx.setLineDash([]);
      const sx=src.x+src.w/2,sy=src.y+src.h/2;
      const tx=tgt.x+tgt.w/2,ty=tgt.y+tgt.h/2;
      const dx=tx-sx,dy=ty-sy,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>300){
        const mx=(sx+tx)/2,my=(sy+ty)/2,ox=-dy*0.08,oy=dx*0.08;
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(mx+ox,my+oy,tx,ty);ctx.stroke();
      }else{ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.stroke();}
      const angle=Math.atan2(ty-sy,tx-sx);
      const ar=Math.min(tgt.w,tgt.h)/2+2;
      const ax=tx-Math.cos(angle)*ar,ay=ty-Math.sin(angle)*ar;
      ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();
      ctx.moveTo(ax,ay);
      ctx.lineTo(ax-5*Math.cos(angle-0.4),ay-5*Math.sin(angle-0.4));
      ctx.lineTo(ax-5*Math.cos(angle+0.4),ay-5*Math.sin(angle+0.4));
      ctx.closePath();ctx.fill();
      if(hl&&hoveredNode===name){
        ctx.globalAlpha=0.85;ctx.fillStyle=gs('--text');
        ctx.font='500 8px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif';
        ctx.textAlign='center';ctx.textBaseline='bottom';
        ctx.fillText(e.a,(sx+tx)/2,(sy+ty)/2-4);
      }
    }
  }
  ctx.globalAlpha=1;

  for(const[name,data]of Object.entries(GRAPH)){
    const pos=nodes[name];if(!pos)continue;
    const mc=MC[data.m];const modC=gs(mc.c),modBg=gs(mc.bg);
    const isH=hoveredNode===name;
    const isConn=hoveredNode&&GRAPH[hoveredNode]&&GRAPH[hoveredNode].edges.some(e=>e.t===name);
    const isSrc=hoveredNode&&data.edges.some(e=>e.t===hoveredNode);
    const hl=isH||isConn||isSrc;
    const dim=(hoveredNode&&!hl)||(searchTerm&&!name.toLowerCase().includes(searchTerm));
    ctx.globalAlpha=dim?0.1:1;ctx.fillStyle=modBg;ctx.strokeStyle=modC;
    ctx.lineWidth=isH?2.5:(name==='MegaMenu'?2:1.2);
    ctx.setLineDash(data.gap?[4,3]:[]);
    ctx.beginPath();ctx.roundRect(pos.x,pos.y,pos.w,pos.h,5);ctx.fill();ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle=modC;
    ctx.font=`${isH?'600':'500'} ${name==='MegaMenu'?'11px':'9.5px'} -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    let lbl=name.replace(/Page$/,'').replace(/Panel$/,'').replace(/Submenu$/,' ▸');
    if(lbl.length>18)lbl=lbl.substring(0,17)+'…';
    ctx.fillText(lbl,pos.x+pos.w/2,pos.y+pos.h/2);
  }
  ctx.globalAlpha=1;ctx.restore();
}

function hitTest(mx,my){
  const x=(mx-panX)/scale,y=(my-panY)/scale;
  for(const[n,p]of Object.entries(nodes)){if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h)return n;}
  return null;
}

let dragging=false,dragStart=null;
wrap.addEventListener('mousedown',e=>{dragging=true;dragStart={x:e.clientX-panX,y:e.clientY-panY};wrap.classList.add('dragging');});
window.addEventListener('mousemove',e=>{
  if(dragging){panX=e.clientX-dragStart.x;panY=e.clientY-dragStart.y;draw();return;}
  const rect=canvas.getBoundingClientRect();
  const hit=hitTest(e.clientX-rect.left,e.clientY-rect.top);
  if(hit!==hoveredNode){
    hoveredNode=hit;draw();
    if(hit){
      const data=GRAPH[hit];const mc=MC[data.m];
      let parts=[];
      parts.push(`<span class="ib-name">${hit}</span>`);
      parts.push(`<span class="ib-mod">${mc.label}${data.mega?' · mega_menu':''}${data.gap?' · <span class="ib-gap">framework_gap</span>':''}</span>`);
      if(data.edges.length){
        const edgeStr=data.edges.map(ed=>`${ed.t} (${ed.a})`).join(', ');
        parts.push(`<span class="ib-edges">Out: ${edgeStr}</span>`);
      }
      infobar.innerHTML=parts.join('<span style="color:var(--border);">|</span>');
    }else{infobar.innerHTML='<span style="color:var(--text-3);">Hover a node to see details</span>';}
  }
});
window.addEventListener('mouseup',()=>{dragging=false;wrap.classList.remove('dragging');});

wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const f=e.deltaY<0?1.12:0.89;
  const ns=Math.max(0.2,Math.min(5,scale*f));
  panX=mx-(mx-panX)*(ns/scale);panY=my-(my-panY)*(ns/scale);
  scale=ns;draw();
},{passive:false});

document.getElementById('zin').addEventListener('click',()=>{scale=Math.min(5,scale*1.3);draw();});
document.getElementById('zout').addEventListener('click',()=>{scale=Math.max(0.2,scale*0.77);draw();});
document.getElementById('zfit').addEventListener('click',()=>{
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const p of Object.values(nodes)){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x+p.w);y1=Math.max(y1,p.y+p.h);}
  const r=wrap.getBoundingClientRect(),gw=x1-x0+80,gh=y1-y0+80;
  scale=Math.min(r.width/gw,r.height/gh,2);
  panX=(r.width-gw*scale)/2-x0*scale+40*scale;
  panY=(r.height-gh*scale)/2-y0*scale+40*scale;
  draw();
});

document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.toLowerCase();draw();});

resize();
document.getElementById('zfit').click();
</script>
