name: Sutra - BDD Scenario Generation

on:
  workflow_dispatch:
    inputs:
      jira_ticket_id:
        description: 'Jira Ticket ID (e.g., ET-25052)'
        required: true
        type: string
      requirements_text:
        description: 'Requirements / Acceptance Criteria / Matrix Text'
        required: true
        type: string

jobs:
  sutra-generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: Configure Git Credentials
        run: |
          git config user.name "Sutra BDD Bot"
          git config user.email "sutra-bot@pulsepoint.com"

      - name: Execute Sutra Engine
        id: sutra_engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_TICKET_ID: ${{ inputs.jira_ticket_id }}
          REQUIREMENTS_TEXT: ${{ inputs.requirements_text }}
        run: |
          python .github/scripts/sutra_agent.py

      - name: Commit and Push Changes
        env:
          BRANCH_NAME: ${{ steps.sutra_engine.outputs.branch_name }}
          TICKET_ID: ${{ inputs.jira_ticket_id }}
        run: |
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "feat($TICKET_ID): Add BDD feature coverage via Sutra"
          git push origin $BRANCH_NAME

      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.sutra_engine.outputs.branch_name }}
          TICKET_ID: ${{ inputs.jira_ticket_id }}
        run: |
          gh pr create \
            --base main \
            --head $BRANCH_NAME \
            --title "feat($TICKET_ID): Sutra BDD Scenario Coverage" \
            --body-file pr_body.md