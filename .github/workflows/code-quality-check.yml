name: Code quality checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-check:
    name: Code quality check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Java Checkstyle
        run: mvn -B -ntp checkstyle:check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Test feature formatter customization
        run: npm run feature:formatter:test

      - name: Check feature file formatting
        run: npm run feature:check
