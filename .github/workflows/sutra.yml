name: Sutra BDD Scenario Generator

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/repo Sutra operates on (skill's Fixed Configuration: pulsepointinc/qa-automation)"
        required: true
        default: "pulsepointinc/qa-automation"
        type: string
      source_type:
        description: "Input source"
        required: true
        type: choice
        options: [jira, sheet, doc, sheet_and_doc]
      source_ref:
        description: "Jira key (QA-1498), Sheet name/URL, or Doc name/URL — space-separate for sheet_and_doc"
        required: true
        type: string
      restrict_to:
        description: "Optional: restrict to a single ticket/tab (e.g. ET-24713) instead of the whole sheet/doc"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  run-sutra:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPO_TOKEN: ${{ secrets.SUTRA_PAT || secrets.SQUASH_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate target repository
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          if [ "$TARGET_REPO" != "pulsepointinc/qa-automation" ]; then
            echo "::error::target_repo must be pulsepointinc/qa-automation"
            exit 1
          fi

      - name: Checkout Sutra configuration
        uses: actions/checkout@v7
        with:
          path: sutra-source

      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: target-repo
          persist-credentials: false

      - name: Install Sutra skill
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR/skills/sutra"
          cp sutra-source/.claude/skills/sutra/SKILL.md \
            "$CLAUDE_CONFIG_DIR/skills/sutra/SKILL.md"
          test -s "$CLAUDE_CONFIG_DIR/skills/sutra/SKILL.md"

      - name: Fetch all remote branches (for Sutra_NNN resolution)
        run: git fetch --all
        working-directory: target-repo

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python (for mcp-atlassian via uvx, and STEP 5's column-width script)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.280
          claude --version

      - name: Configure git identity
        run: |
          git config --global user.name "sutra-bot"
          git config --global user.email "sutra-bot@users.noreply.github.com"

      - name: Authenticate gh CLI
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}

      - name: Write Google Drive service-account key
        if: ${{ inputs.source_type != 'jira' }}
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          if [ -z "$GDRIVE_SERVICE_ACCOUNT" ]; then
            echo "::error::GDRIVE_SERVICE_ACCOUNT_JSON_B64 is empty or unset"
            exit 1
          fi

          key_path="${RUNNER_TEMP}/gdrive-service-account.json"
          if ! printf '%s' "$GDRIVE_SERVICE_ACCOUNT" | base64 --decode > "$key_path" 2>/dev/null; then
            printf '%s' "$GDRIVE_SERVICE_ACCOUNT" > "$key_path"
          fi

          python3 - "$key_path" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          try:
              with open(path, encoding="utf-8") as key_file:
                  credentials = json.load(key_file)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(
                  "::error::GDRIVE_SERVICE_ACCOUNT_JSON_B64 is neither "
                  "valid base64-encoded JSON nor raw JSON"
              ) from exc

          required = {"type", "client_email", "private_key"}
          if credentials.get("type") != "service_account" or not required.issubset(credentials):
              raise SystemExit(
                  "::error::Google Drive credentials are not a valid "
                  "service-account key"
              )
          PY
          chmod 600 "$key_path"

      - name: Render MCP server config
        env:
          SOURCE_TYPE: ${{ inputs.source_type }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GDRIVE_KEY_PATH: ${{ runner.temp }}/gdrive-service-account.json
        run: |
          python3 - "${RUNNER_TEMP}/mcp-config.json" <<'PY'
          import json
          import os
          import sys

          source_type = os.environ["SOURCE_TYPE"]
          servers = {}

          if source_type == "jira":
              jira_values = {
                  "JIRA_URL": os.environ.get("JIRA_URL", ""),
                  "JIRA_USERNAME": os.environ.get("JIRA_USERNAME", ""),
                  "JIRA_API_TOKEN": os.environ.get("JIRA_API_TOKEN", ""),
              }
              missing = [name for name, value in jira_values.items() if not value]
              if missing:
                  raise SystemExit(
                      "::error::Missing Jira secrets: " + ", ".join(missing)
                  )
              servers["atlassian"] = {
                  "command": "uvx",
                  "args": ["mcp-atlassian@2.0.0"],
                  "env": jira_values,
              }
          else:
              servers["google-drive"] = {
                  "command": "npx",
                  "args": ["-y", "@piotr-agier/google-drive-mcp@2.11.0"],
                  "env": {
                      "GOOGLE_APPLICATION_CREDENTIALS": os.environ["GDRIVE_KEY_PATH"]
                  },
              }

          with open(sys.argv[1], "w", encoding="utf-8") as config_file:
              json.dump({"mcpServers": servers}, config_file)
          PY

      - name: Run Sutra
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
          GH_TOKEN: ${{ env.REPO_TOKEN }}
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RESTRICT_TO: ${{ inputs.restrict_to }}
        run: |
          PROMPT="/sutra ${SOURCE_TYPE}: ${SOURCE_REF}"
          if [ -n "$RESTRICT_TO" ]; then
            PROMPT="$PROMPT (restrict to ${RESTRICT_TO} only)"
          fi
          PROMPT="$PROMPT

          This is a non-interactive workflow_dispatch run, which authorizes the
          connector fetch for the supplied source. Complete the delivery without
          pausing for another approval. Create any generated PR against main.
          After verifying a created PR, print exactly SUTRA_PR_URL=<verified URL>
          on its own line. If every item is Duplicate or Blocked and no file
          change is needed, print exactly SUTRA_NO_CHANGES=<concise reason>."
          claude -p "$PROMPT" \
            --mcp-config "${RUNNER_TEMP}/mcp-config.json" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,mcp__google-drive__*,mcp__atlassian__*" \
            --permission-mode bypassPermissions \
            --model claude-opus-5 \
            --output-format text \
            2>&1 | tee "${RUNNER_TEMP}/sutra-run.log"
        working-directory: target-repo

      - name: Verify Sutra produced a PR (surface Halting Conditions)
        if: always()
        run: |
          {
            echo "### Sutra run summary"
            echo '```'
            if [ -f "${RUNNER_TEMP}/sutra-run.log" ]; then
              tail -n 80 "${RUNNER_TEMP}/sutra-run.log"
            else
              echo "Sutra did not start; inspect the first failed setup step."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f "${RUNNER_TEMP}/sutra-run.log" ]; then
            exit 1
          fi

          pr_url=$(grep -oE '^SUTRA_PR_URL=https://github\.com/[^ ]+/pull/[0-9]+' \
            "${RUNNER_TEMP}/sutra-run.log" | tail -n 1 | cut -d= -f2-)
          if [ -n "$pr_url" ]; then
            gh pr view "$pr_url" --json url --jq .url
            exit 0
          fi

          if grep -qE '^SUTRA_NO_CHANGES=' "${RUNNER_TEMP}/sutra-run.log"; then
            exit 0
          fi

          echo "::error::Sutra produced neither a verified PR nor an explicit no-change result. See the log above."
          exit 1
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}

      - name: Upload run transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sutra-run-log
          path: ${{ runner.temp }}/sutra-run.log
          if-no-files-found: ignore
