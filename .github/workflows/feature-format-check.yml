name: Feature file formatting

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feature-format-check:
    name: Feature format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test formatter customization
        run: npm run feature:formatter:test

      - name: Check feature file formatting
        run: npm run feature:check
