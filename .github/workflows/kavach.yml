name: Kavach Live-Replay Failure Diagnosis

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app the failing scenarios belong to"
        required: true
        type: choice
        options: [life, studio]
        default: life
      environment:
        description: "Target environment for login"
        required: true
        type: choice
        options: [Demo, Pre-release]
        default: Demo
      user_type:
        description: "Internal or External login (Life only; ignored for Studio)"
        required: false
        type: choice
        options: [Internal, External]
        default: Internal
      feature_path:
        description: "Feature file or directory to run, e.g. src/test/resources/features/life/Life_Pixels.feature. Leave blank to run whatever TestRunner.java's @CucumberOptions already specifies, untouched."
        required: false
        type: string
      cucumber_tags:
        description: "Cucumber tag filter for the run that produces the failures to diagnose, e.g. @regression. Leave blank to run whatever TestRunner.java's @CucumberOptions already specifies, untouched."
        required: false
        type: string
      hold_seconds:
        description: "How long the auth bootstrap holds the browser open (seconds)"
        required: false
        type: string
        default: "3600"
      max_budget_usd:
        description: "Maximum Anthropic API spend for this run"
        required: false
        type: string
        default: "50"

# Two overlapping runs would each upload a full (not diffed) snapshot of
# kavach-data/fix-patterns for open-fix-pattern-pr to lay down on top of a
# fresh main checkout -- a first run's PR merging while a second, slower run
# is still in flight would have that second run's stale snapshot silently
# overwrite the just-merged patterns with no conflict marker. Queue instead
# of racing.
concurrency:
  group: kavach-learned-patterns
  cancel-in-progress: false

jobs:
  run-kavach:
    runs-on: ubuntu-latest
    # Read-only: this job never needs to push or open a PR. Only the
    # open-fix-pattern-pr job below (which needs a validated handoff first)
    # gets contents:write/pull-requests:write, so a compromised or buggy
    # prompt/tool call here can't push anything even if it tried.
    permissions:
      contents: read
    outputs:
      contract_valid: ${{ steps.contract.outputs.valid }}
      boundary_ok: ${{ steps.boundary.outputs.ok }}
      combined_receipts_path: ${{ steps.contract.outputs.combined_receipts_path }}
      verdict_report_path: ${{ steps.verify_verdict.outputs.verdict_report_path }}
      kavach_data_artifact: kavach-data-for-pr-${{ github.run_id }}-${{ github.run_attempt }}
    # Pinned to match pom.xml's com.microsoft.playwright version exactly (1.50.0), so the
    # browser + OS deps baked into this image are guaranteed to satisfy what the Java
    # driver actually launches — avoids ubuntu-latest's rolling OS release drifting out of
    # sync with a pinned Playwright version's own dependency-detection tables.
    container:
      image: mcr.microsoft.com/playwright:v1.50.0-noble
      # Claude Code's --agent mode sandboxes its own Bash calls via bubblewrap,
      # which needs to create nested user/mount/pid namespaces (mounting a
      # fresh /proc, etc). Docker blocks this at multiple independent layers
      # by default — cap-add + unconfined seccomp/apparmor alone still hit
      # "Can't mount proc on /newroot/proc: Operation not permitted". Full
      # --privileged is the maximal, decisive test: if bubblewrap still can't
      # sandbox under this, GitHub's hosted runner blocks nested sandboxing
      # inside a job container entirely, and --agent mode needs a bare VM
      # (like Netra/Sutra's CI, which never hits this since it isn't nested
      # inside a container at all).
      options: --privileged
    timeout-minutes: 90
    env:
      CDP_PORT: ${{ inputs.app == 'studio' && '9224' || '9223' }}
      MCP_CONFIG: ${{ inputs.app == 'studio' && '.claude/mcp-ci-studio.json' || '.claude/mcp-ci-life.json' }}
      # Pinned to the exact Claude Code CLI version pulsepointinc/qa-automation's
      # own Netra/Sutra CI workflows validated --agent + sandbox behavior against.
      CLAUDE_CODE_VERSION: "2.1.281"
      APP_NAME: ${{ inputs.app }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      AUTH_USER_TYPE: ${{ inputs.user_type }}
      # feature_path/cucumber_tags/hold_seconds/max_budget_usd are freeform
      # string inputs (unlike app/environment/user_type, which are `choice`
      # inputs GitHub restricts to fixed enum values). Passed through env:
      # here rather than interpolated directly into run: script text below,
      # so a value containing shell metacharacters is just an inert string,
      # never spliced into the script before the shell parses it.
      FEATURE_PATH: ${{ inputs.feature_path }}
      CUCUMBER_TAGS: ${{ inputs.cucumber_tags }}
      AUTH_HOLD_SECONDS: ${{ inputs.hold_seconds }}
      MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Maven
        run: |
          apt-get update
          apt-get install -y maven lsb-release

      - name: Set up Node (Claude Code CLI + Playwright MCP)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python (kavach-diagnose scripts)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No cache: pip here — actions/setup-python's cache option needs a
          # working `pip` executable to compute a cache key, but the toolcache
          # Python installed inside this container doesn't have one linked
          # (ENOENT spawning it directly). `python -m pip install` below
          # works anyway since it invokes the pip module, not that missing
          # executable.

      - name: Install kavach-diagnose Python dependencies
        run: >-
          python -m pip install
          --requirement .claude/skills/kavach-diagnose/scripts/requirements.txt

      - name: Run kavach-diagnose regression suite
        run: |
          # Must be genuine pytest, not `unittest discover`: several test
          # files (e.g. test_offline_dom_analyzer.py) use plain pytest
          # fixtures/classes rather than unittest.TestCase, so
          # `unittest discover` silently collects and runs zero tests from
          # them even when they import cleanly — pytest is the only runner
          # that actually exercises the full suite.
          python -m pytest .claude/skills/kavach-diagnose/scripts/tests/ -v

      - name: Install Claude subprocess sandbox
        run: apt-get update && apt-get install --yes bubblewrap socat

      - name: Install pinned Claude Code CLI
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Run the target Cucumber suite (produces cucumber.json + failures, if any)
        continue-on-error: true
        run: |
          set -- mvn -B -ntp test -Dtest=TestRunner
          if [ -n "${FEATURE_PATH}" ]; then
            set -- "$@" -Dcucumber.features="${FEATURE_PATH}"
          fi
          if [ -n "${CUCUMBER_TAGS}" ]; then
            set -- "$@" -Dcucumber.filter.tags="${CUCUMBER_TAGS}"
          fi
          "$@"

      - name: Extract failures for replay (mechanical, no LLM)
        run: |
          cd .claude/skills/kavach-diagnose/scripts
          python3 list_failures.py

      - name: Start Life auth bootstrap
        if: ${{ inputs.app == 'life' }}
        run: |
          nohup mvn -B -ntp test -Dtest=LifeAuthStateBootstrapTest \
            -Dauth.environment="${TARGET_ENVIRONMENT}" \
            -Dauth.userType="${AUTH_USER_TYPE}" \
            -Dauth.holdSeconds="${AUTH_HOLD_SECONDS}" \
            -Dauth.headless=true \
            > life-bootstrap.log 2>&1 &
          echo "BOOTSTRAP_PID=$!" >> "$GITHUB_ENV"

      - name: Start Studio auth bootstrap
        if: ${{ inputs.app == 'studio' }}
        run: |
          nohup mvn -B -ntp test -Dtest=StudioAuthStateBootstrapTest \
            -Dauth.holdForCdp=true \
            -Dauth.holdSeconds="${AUTH_HOLD_SECONDS}" \
            > studio-bootstrap.log 2>&1 &
          echo "BOOTSTRAP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for CDP endpoint to come up
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (echo > "/dev/tcp/localhost/$CDP_PORT") 2>/dev/null; then
              echo "CDP endpoint on port $CDP_PORT is up."
              exit 0
            fi
            sleep 5
          done
          echo "::error::CDP endpoint on port $CDP_PORT never came up. See bootstrap log."
          echo "--- life-bootstrap.log / studio-bootstrap.log (mvn wrapper) ---"
          cat life-bootstrap.log studio-bootstrap.log 2>/dev/null || true
          echo "--- target/*-cdp-*.log (raw Chromium subprocess stdout/stderr) ---"
          cat target/life-cdp-*.log target/studio-cdp-*.log 2>/dev/null || true
          exit 1

      - name: Make workspace writable for bubblewrap sandbox
        run: |
          # --agent mode's bubblewrap sandbox runs its Bash subprocess as an
          # effective UID that isn't necessarily root, even though the outer
          # step runs as root in this container — and it tries to create a
          # .gitconfig at the repo root as part of its own setup. Loosen
          # permissions on this throwaway CI checkout so that succeeds.
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Run Kavach live replay
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB dropped: it forces permission-mode
          # back to default at startup (prints a warning) unless --allowedTools
          # is explicit — which we already always pass — so it added a
          # confusing warning with no functional benefit here. No need to
          # match Netra/Sutra's exact env vars where one doesn't earn its keep.
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
          CLAUDE_CODE_MCP_ALLOWLIST_ENV: "1"
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Missing ANTHROPIC_API_KEY GitHub Secret."
            exit 1
          fi

          prompt=$(printf '%s\n' \
            "Diagnose the failures from the Cucumber run that just completed for the ${APP_NAME} app (environment: ${TARGET_ENVIRONMENT})." \
            "The matching auth bootstrap is already logged in and holding a browser open on CDP port ${CDP_PORT}; the Playwright MCP server is already configured to attach to it — never attempt your own login." \
            "Run your full pipeline (failure-triage -> live-replay-diagnosis -> verdict-reporting) end to end and stop once the verdict report and combined-receipts.json are written and validated against .claude/contracts/kavach-verdict.schema.json.")

          # kavach-diagnose is never meant to touch application/test source —
          # both Write and Edit are scoped to kavach-data/** here, matching
          # the agent definition's own tool list exactly (Write(kavach-data/**)),
          # plus Edit(kavach-data/**) for editing files this run already wrote.
          # This --allowedTools string is not the real enforcement boundary on
          # its own (Bash(*) is unrestricted and could write anywhere via shell
          # redirection) -- the "Verify repository boundaries" step later in
          # this job is what actually detects and fails on an out-of-scope
          # write, and its outcome gates the PR job below (see boundary_ok).
          claude --agent kavach-diagnose \
            --print "${prompt}" \
            --mcp-config "$MCP_CONFIG" \
            --strict-mcp-config \
            --permission-mode dontAsk \
            --allowedTools "Bash(*),Read,Write(kavach-data/**),Edit(kavach-data/**),Grep,Glob,mcp__playwright__browser_navigate,mcp__playwright__browser_tabs,mcp__playwright__browser_snapshot,mcp__playwright__browser_evaluate,mcp__playwright__browser_click,mcp__playwright__browser_fill_form,mcp__playwright__browser_type,mcp__playwright__browser_press_key,mcp__playwright__browser_wait_for,mcp__playwright__browser_run_code_unsafe,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_close,mcp__playwright__browser_select_option,mcp__playwright__browser_hover,mcp__playwright__browser_find" \
            --model sonnet \
            --max-budget-usd "${MAX_BUDGET_USD}" \
            --no-session-persistence \
            --output-format text \
            2>&1 | tee kavach-run.log

      - name: Release the auth bootstrap
        if: always()
        run: |
          touch ".claude/auth/${APP_NAME}-cdp-done"
          sleep 5
          kill "$BOOTSTRAP_PID" 2>/dev/null || true

      - name: Verify Kavach produced a verdict report
        id: verify_verdict
        if: always()
        shell: bash
        run: |
          {
            echo "### Kavach run summary"
            echo '```'
            tail -n 80 kavach-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          verdicts=(kavach-data/history/replay-verdict-*.md)
          if [ ${#verdicts[@]} -eq 0 ]; then
            echo "::error::Kavach did not produce a verdict report under kavach-data/history/. It likely hit PLAYWRIGHT_TOOL_REJECTED, CDP_ENDPOINT_DEAD, or another halting condition. See the log above."
            exit 1
          fi
          echo "verdict_report_path=${verdicts[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate combined-receipts.json against the kavach-verdict contract
        id: contract
        if: always()
        shell: bash
        run: |
          # This is the hard gate between kavach-diagnose and any downstream
          # processing (the PR job below, and eventually kavach-repair):
          # resolve exactly one combined-receipts.json, fail if it's missing
          # or ambiguous, run the deterministic validator against it, and
          # record the outcome in the job summary before anything is
          # uploaded or a PR is opened.
          shopt -s nullglob globstar
          receipts=(kavach-data/history/**/combined-receipts.json)

          {
            echo "### Kavach contract validation"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#receipts[@]} -eq 0 ]; then
            echo "::error::No combined-receipts.json found under kavach-data/history/. Kavach did not produce a validated handoff document."
            echo "Result: **FAIL** — no combined-receipts.json found." >> "$GITHUB_STEP_SUMMARY"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ ${#receipts[@]} -gt 1 ]; then
            echo "::error::Found ${#receipts[@]} combined-receipts.json files under kavach-data/history/ — expected exactly one."
            printf '%s\n' "${receipts[@]}"
            echo "Result: **FAIL** — ${#receipts[@]} combined-receipts.json files found, expected exactly one." >> "$GITHUB_STEP_SUMMARY"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          receipt="${receipts[0]}"
          echo "combined_receipts_path=${receipt}" >> "$GITHUB_OUTPUT"

          if python3 .claude/skills/kavach-diagnose/scripts/validate_kavach_contract.py "${receipt}" | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::${receipt} failed contract validation — see problems above."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Verify repository boundaries
        id: boundary
        if: always()
        shell: bash
        run: |
          # kavach-diagnose is only ever allowed to write under target/ (build
          # output), its own scripts/history/ working directory, and
          # kavach-knowledge's fix-patterns/ — never application or test source.
          # This step's own outcome (boundary_ok) gates open-fix-pattern-pr below
          # alongside contract_valid -- a boundary violation must never be masked
          # by an apparently-successful fix-pattern PR appearing right alongside
          # a failed run-kavach job.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          changes=$(git status --porcelain --untracked-files=all -- . \
            ':(exclude)target/**' \
            ':(exclude)kavach-data/history/**' \
            ':(exclude)kavach-data/fix-patterns/**')
          if [ -n "${changes}" ]; then
            echo "::error::Kavach modified files outside its allowed write locations."
            printf '%s\n' "${changes}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Upload verdict report + receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kavach-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            kavach-data/history/replay-verdict-*.md
            kavach-data/history/**/combined-receipts.json
            target/cucumber-reports/**

      - name: Upload run transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kavach-run-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            kavach-run.log
            life-bootstrap.log
            studio-bootstrap.log

      - name: Upload learned fix-patterns for the PR job
        # Only ever hand off fix-patterns/verdict from a run whose
        # combined-receipts.json actually passed the contract gate above —
        # an invalid or malformed handoff document must never feed the
        # fix-pattern cache that later runs and kavach-repair trust. This
        # job has no push/PR credentials at all (contents: read only); the
        # separate open-fix-pattern-pr job below is the only place those
        # credentials exist, and it only acts on this artifact.
        if: always() && steps.contract.outputs.valid == 'true' && steps.boundary.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kavach-data-for-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            kavach-data/fix-patterns
            kavach-data/history/fix-history.json
            kavach-data/history/replay-verdict-*.md
          if-no-files-found: error

  open-fix-pattern-pr:
    needs: run-kavach
    if: always() && needs.run-kavach.outputs.contract_valid == 'true' && needs.run-kavach.outputs.boundary_ok == 'true'
    runs-on: ubuntu-latest
    # The only job in this workflow with write credentials — split out from
    # run-kavach so that Kavach's own Bash/Write calls (running with an
    # LLM-driven, sandboxed but still untrusted prompt loop) never execute
    # anywhere near a token that can push or open a PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download learned fix-patterns from run-kavach
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.run-kavach.outputs.kavach_data_artifact }}
          # upload-artifact strips the common ancestor shared by every
          # uploaded path (kavach-data/fix-patterns, kavach-data/history/*),
          # so the artifact's own root is fix-patterns/ and history/, not
          # kavach-data/fix-patterns/ and kavach-data/history/. Download
          # into kavach-data/ to put that stripped prefix back, or the
          # files land at the wrong location and git status never sees
          # them as changes.
          path: kavach-data

      - name: Open PR for kavach's learned fix patterns
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Kavach only ever writes these three things (fix-patterns/*.md,
          # fix-history.json, and its own timestamped verdict report) — never
          # application or test source. Those require human approval and go
          # through kavach-repair's own PR instead. This just persists the
          # pattern-cache learning and verdict report that would otherwise be
          # silently discarded when the runner is destroyed — committing the
          # verdict report means it's readable directly on GitHub, no artifact
          # download needed.
          git config --global user.name "kavach-bot"
          git config --global user.email "kavach-bot@users.noreply.github.com"

          # git diff --quiet only sees tracked-file modifications — it misses
          # a brand-new fix-pattern file for a feature seen for the first
          # time, or this run's verdict report (always a new, untracked
          # filename). git status --porcelain catches both.
          changes=$(git status --porcelain --untracked-files=all -- \
            kavach-data/fix-patterns kavach-data/history/fix-history.json kavach-data/history/replay-verdict-*.md)
          if [ -z "${changes}" ]; then
            echo "No fix-pattern/history/verdict changes to commit."
            exit 0
          fi

          # Branch name is keyed only on run_id (not run_attempt), so a retry
          # of this job reuses and force-updates the same branch/PR instead
          # of opening a duplicate one.
          BRANCH="kavach/learned-patterns-run-${{ github.run_id }}"
          git checkout -B "$BRANCH"
          git add kavach-data/fix-patterns kavach-data/history/fix-history.json kavach-data/history/replay-verdict-*.md
          git commit -m "Kavach: update learned fix patterns from $(date -u +%Y-%m-%d) run"
          git push --force-with-lease origin "$BRANCH"

          existing_pr=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "${existing_pr}" ]; then
            echo "PR #${existing_pr} already open for ${BRANCH}; branch push above updated it."
            exit 0
          fi

          body=$(printf '%s\n\n%s' \
            "Automated update to \`kavach-data/fix-patterns/*.md\`, \`fix-history.json\`, and this run's \`replay-verdict-*.md\` report. Bookkeeping only — no application or test source files are touched by this PR." \
            "Originating run: ${RUN_URL}")

          gh pr create --base main --head "$BRANCH" \
            --title "Kavach: update learned fix patterns ($(date -u +%Y-%m-%d))" \
            --body "${body}"
