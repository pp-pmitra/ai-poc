name: Kavach Live-Replay Failure Diagnosis

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app the failing scenarios belong to"
        required: true
        type: choice
        options: [life, studio]
        default: life
      environment:
        description: "Target environment for login"
        required: true
        type: choice
        options: [Demo, Pre-release]
        default: Demo
      user_type:
        description: "Internal or External login (Life only; ignored for Studio)"
        required: false
        type: choice
        options: [Internal, External]
        default: Internal
      feature_path:
        description: "Feature file or directory to run, e.g. src/test/resources/features/life/Life_Pixels.feature. Leave blank to run whatever TestRunner.java's @CucumberOptions already specifies, untouched."
        required: false
        type: string
      cucumber_tags:
        description: "Cucumber tag filter for the run that produces the failures to diagnose, e.g. @regression. Leave blank to run whatever TestRunner.java's @CucumberOptions already specifies, untouched."
        required: false
        type: string
      hold_seconds:
        description: "How long the auth bootstrap holds the browser open (seconds)"
        required: false
        type: string
        default: "3600"
      max_budget_usd:
        description: "Maximum Anthropic API spend for this run"
        required: false
        type: string
        default: "50"

permissions:
  contents: write
  pull-requests: write

jobs:
  run-kavach:
    runs-on: ubuntu-latest
    # Pinned to match pom.xml's com.microsoft.playwright version exactly (1.50.0), so the
    # browser + OS deps baked into this image are guaranteed to satisfy what the Java
    # driver actually launches — avoids ubuntu-latest's rolling OS release drifting out of
    # sync with a pinned Playwright version's own dependency-detection tables.
    container:
      image: mcr.microsoft.com/playwright:v1.50.0-noble
      # Claude Code's --agent mode sandboxes its own Bash calls via bubblewrap,
      # which needs to create a Linux user namespace. Docker blocks that by
      # default (seccomp + missing capability) — Netra/Sutra never hit this
      # because their CI runs directly on a bare ubuntu-latest VM, not nested
      # inside a container. These options let bubblewrap actually work here.
      options: --cap-add=SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    timeout-minutes: 90
    env:
      CDP_PORT: ${{ inputs.app == 'studio' && '9224' || '9223' }}
      MCP_CONFIG: ${{ inputs.app == 'studio' && '.claude/mcp-ci-studio.json' || '.claude/mcp-ci-life.json' }}
      # Pinned to the exact Claude Code CLI version pulsepointinc/qa-automation's
      # own Netra/Sutra CI workflows validated --agent + sandbox behavior against.
      CLAUDE_CODE_VERSION: "2.1.281"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Maven
        run: |
          apt-get update
          apt-get install -y maven lsb-release

      - name: Set up Node (Claude Code CLI + Playwright MCP)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python (kavach-diagnose scripts)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No cache: pip here — actions/setup-python's cache option needs a
          # working `pip` executable to compute a cache key, but the toolcache
          # Python installed inside this container doesn't have one linked
          # (ENOENT spawning it directly). `python -m pip install` below
          # works anyway since it invokes the pip module, not that missing
          # executable.

      - name: Install kavach-diagnose Python dependencies
        run: >-
          python -m pip install
          --requirement .claude/skills/kavach-diagnose/scripts/requirements.txt

      - name: Install Claude subprocess sandbox
        run: apt-get update && apt-get install --yes bubblewrap socat

      - name: Install pinned Claude Code CLI
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Run the target Cucumber suite (produces cucumber.json + failures, if any)
        continue-on-error: true
        run: |
          set -- mvn -B -ntp test -Dtest=TestRunner
          if [ -n "${{ inputs.feature_path }}" ]; then
            set -- "$@" -Dcucumber.features="${{ inputs.feature_path }}"
          fi
          if [ -n "${{ inputs.cucumber_tags }}" ]; then
            set -- "$@" -Dcucumber.filter.tags="${{ inputs.cucumber_tags }}"
          fi
          "$@"

      - name: Extract failures for replay (mechanical, no LLM)
        run: |
          cd .claude/skills/kavach-diagnose/scripts
          python3 list_failures.py

      - name: Start Life auth bootstrap
        if: ${{ inputs.app == 'life' }}
        run: |
          nohup mvn -B -ntp test -Dtest=LifeAuthStateBootstrapTest \
            -Dauth.environment="${{ inputs.environment }}" \
            -Dauth.userType="${{ inputs.user_type }}" \
            -Dauth.holdSeconds="${{ inputs.hold_seconds }}" \
            -Dauth.headless=true \
            > life-bootstrap.log 2>&1 &
          echo "BOOTSTRAP_PID=$!" >> "$GITHUB_ENV"

      - name: Start Studio auth bootstrap
        if: ${{ inputs.app == 'studio' }}
        run: |
          nohup mvn -B -ntp test -Dtest=StudioAuthStateBootstrapTest \
            -Dauth.holdForCdp=true \
            -Dauth.holdSeconds="${{ inputs.hold_seconds }}" \
            > studio-bootstrap.log 2>&1 &
          echo "BOOTSTRAP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for CDP endpoint to come up
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (echo > "/dev/tcp/localhost/$CDP_PORT") 2>/dev/null; then
              echo "CDP endpoint on port $CDP_PORT is up."
              exit 0
            fi
            sleep 5
          done
          echo "::error::CDP endpoint on port $CDP_PORT never came up. See bootstrap log."
          echo "--- life-bootstrap.log / studio-bootstrap.log (mvn wrapper) ---"
          cat life-bootstrap.log studio-bootstrap.log 2>/dev/null || true
          echo "--- target/*-cdp-*.log (raw Chromium subprocess stdout/stderr) ---"
          cat target/life-cdp-*.log target/studio-cdp-*.log 2>/dev/null || true
          exit 1

      - name: Make workspace writable for bubblewrap sandbox
        run: |
          # --agent mode's bubblewrap sandbox runs its Bash subprocess as an
          # effective UID that isn't necessarily root, even though the outer
          # step runs as root in this container — and it tries to create a
          # .gitconfig at the repo root as part of its own setup. Loosen
          # permissions on this throwaway CI checkout so that succeeds.
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Run Kavach live replay
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
          CLAUDE_CODE_MCP_ALLOWLIST_ENV: "1"
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Missing ANTHROPIC_API_KEY GitHub Secret."
            exit 1
          fi

          prompt=$(printf '%s\n' \
            "Diagnose the failures from the Cucumber run that just completed for the ${{ inputs.app }} app (environment: ${{ inputs.environment }})." \
            "The matching auth bootstrap is already logged in and holding a browser open on CDP port ${CDP_PORT}; the Playwright MCP server is already configured to attach to it — never attempt your own login." \
            "Run your full pipeline (failure-triage -> live-replay-diagnosis -> verdict-reporting) end to end and stop once the verdict report and combined-receipts.json are written and validated against .claude/contracts/kavach-verdict.schema.json.")

          claude --agent kavach-diagnose \
            --print "${prompt}" \
            --mcp-config "$MCP_CONFIG" \
            --strict-mcp-config \
            --permission-mode dontAsk \
            --allowedTools "Bash(*),Read,Write(*),Edit(*),Grep,Glob,mcp__playwright__browser_navigate,mcp__playwright__browser_tabs,mcp__playwright__browser_snapshot,mcp__playwright__browser_evaluate,mcp__playwright__browser_click,mcp__playwright__browser_fill_form,mcp__playwright__browser_type,mcp__playwright__browser_press_key,mcp__playwright__browser_wait_for,mcp__playwright__browser_run_code_unsafe,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_close,mcp__playwright__browser_select_option,mcp__playwright__browser_hover,mcp__playwright__browser_find" \
            --model sonnet \
            --max-budget-usd "${{ inputs.max_budget_usd }}" \
            --no-session-persistence \
            --output-format text \
            2>&1 | tee kavach-run.log

      - name: Release the auth bootstrap
        if: always()
        run: |
          touch ".claude/auth/${{ inputs.app }}-cdp-done"
          sleep 5
          kill "$BOOTSTRAP_PID" 2>/dev/null || true

      - name: Verify Kavach produced a verdict report
        if: always()
        shell: bash
        run: |
          {
            echo "### Kavach run summary"
            echo '```'
            tail -n 80 kavach-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          verdicts=(.claude/skills/kavach-diagnose/scripts/history/replay-verdict-*.md)
          if [ ${#verdicts[@]} -eq 0 ]; then
            echo "::error::Kavach did not produce a verdict report under .claude/skills/kavach-diagnose/scripts/history/. It likely hit PLAYWRIGHT_TOOL_REJECTED, CDP_ENDPOINT_DEAD, or another halting condition. See the log above."
            exit 1
          fi

      - name: Verify repository boundaries
        if: always()
        shell: bash
        run: |
          # kavach-diagnose is only ever allowed to write under target/ (build
          # output), its own scripts/history/ working directory, and
          # kavach-knowledge's fix-patterns/ — never application or test source.
          changes=$(git status --porcelain --untracked-files=all -- . \
            ':(exclude)target/**' \
            ':(exclude).claude/skills/kavach-diagnose/scripts/history/**' \
            ':(exclude).claude/skills/kavach-knowledge/fix-patterns/**')
          if [ -n "${changes}" ]; then
            echo "::error::Kavach modified files outside its allowed write locations."
            printf '%s\n' "${changes}"
            exit 1
          fi

      - name: Upload verdict report + receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kavach-verdict
          path: |
            .claude/skills/kavach-diagnose/scripts/history/replay-verdict-*.md
            .claude/skills/kavach-diagnose/scripts/history/**/combined-receipts.json
            target/cucumber-reports/**

      - name: Upload run transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kavach-run-log
          path: |
            kavach-run.log
            life-bootstrap.log
            studio-bootstrap.log

      - name: Open PR for kavach's learned fix patterns
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Kavach's Phase 5 only ever appends to these two bookkeeping files
          # (fix-patterns/*.md, fix-history.json) — never application or test
          # source. Those require human approval and go through kavach-imaintain's
          # own PR instead. This just persists the pattern-cache learning that
          # would otherwise be silently discarded when the runner is destroyed.
          if ! command -v git >/dev/null || ! command -v gh >/dev/null; then
            apt-get update
            command -v git >/dev/null || apt-get install -y git
            if ! command -v gh >/dev/null; then
              apt-get install -y wget
              wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | tee /usr/share/keyrings/githubcli-archive-keyring.gpg > /dev/null
              chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
              apt-get update
              apt-get install -y gh
            fi
          fi

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "kavach-bot"
          git config --global user.email "kavach-bot@users.noreply.github.com"

          if git diff --quiet -- .claude/skills/kavach-knowledge/fix-patterns .claude/skills/kavach-diagnose/scripts/history/fix-history.json; then
            echo "No fix-pattern/history changes to commit."
            exit 0
          fi

          BRANCH="kavach/learned-patterns-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add .claude/skills/kavach-knowledge/fix-patterns .claude/skills/kavach-diagnose/scripts/history/fix-history.json
          git commit -m "Kavach: update learned fix patterns from $(date -u +%Y-%m-%d) run"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "Kavach: update learned fix patterns ($(date -u +%Y-%m-%d))" \
            --body "Automated update to \`.claude/skills/kavach-knowledge/fix-patterns/*.md\` and \`fix-history.json\` from this run's Phase 5. Bookkeeping only — no application or test source files are touched by this PR."
