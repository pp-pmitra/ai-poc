[project]
name = "failure-analyzer"
version = "0.1.0"
description = "AI-powered test failure analyzer for Cucumber/Playwright"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.30.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
failure-analyzer = "failure_analyzer.main:main"
record-history = "record_history:main"
refresh-glossary = "refresh_glossary:main"
